name: release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Turn the tag (e.g. v1.2.3) into a numeric assembly version (1.2.3).
      - name: Compute version
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Framework-dependent single-file exe (~1 MB). Requires the .NET 8 Desktop Runtime
      # installed on the target machine.
      - name: Publish framework-dependent single-file exe
        run: >
          dotnet publish -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: publish/GmailCalendarNotifier.exe
